# RL from the validation-selected 2,000-example SFT adapter.
# The 128 validation questions are excluded from RL training.
model: Qwen/Qwen3.5-2B
languages:
- ta
data_jsonl: outputs/qwen35_ta_sft_2000/rl_train.jsonl
output_dir: outputs/tapo_ta_qwen35_sft_2000_rl
max_samples: 0
max_steps: -1
num_train_epochs: 2
per_device_train_batch_size: 2
num_generations: 8
gradient_accumulation_steps: 4
max_completion_length: 1024
tapo_alpha: 0.25
learning_rate: 1.0e-06
weight_decay: 0.0
warmup_ratio: 0.0
lr_scheduler_type: linear
max_grad_norm: 1.0
num_iterations: 1
epsilon: 0.2
epsilon_high: 0.28
seed: 3407
log_entropy: false
optim: adamw_torch_fused
precision: auto
gradient_checkpointing: true
mask_truncated_completions: false
temperature: 1.0
top_p: 1.0
top_k: 20
min_p: 0.0
presence_penalty: 2.0
repetition_penalty: 1.0
full_finetune: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules: model.language_model.*(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|in_proj_b|in_proj_a|out_proj|gate_proj|up_proj|down_proj)
logging_steps: 1
log_completions: true
num_completions_to_print: 0
save_steps: 25
save_total_limit: 2
dataloader_num_workers: 0
resume: null
init_adapter: outputs/qwen35_ta_sft_2000/adapter
report_to: wandb
wandb_project: indic-reasoning-tapo
wandb_entity: null
wandb_mode: online
run_name: tapo-tamil-qwen35-2b-sft-2000-rl
use_vllm: true
vllm_enforce_eager: true
vllm_gdn_prefill_backend: triton
vllm_mode: colocate
vllm_enable_sleep_mode: true
vllm_gpu_memory_utilization: 0.4
vllm_max_model_length: 2048
vllm_importance_sampling_correction: true
vllm_importance_sampling_mode: token_truncate
vllm_importance_sampling_clip_max: 3.0
